name: Publish frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Require the public ngrok origin
        env:
          VITE_API_ORIGIN: ${{ vars.NGROK_API_ORIGIN }}
        run: |
          if [ -z "$VITE_API_ORIGIN" ]; then
            echo "Set repository variable NGROK_API_ORIGIN to your https://...ngrok-free.dev URL" >&2
            exit 1
          fi
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_ORIGIN: ${{ vars.NGROK_API_ORIGIN }}
        run: |
          npm ci
          npm run build -- --base "/${{ github.event.repository.name }}/"
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
