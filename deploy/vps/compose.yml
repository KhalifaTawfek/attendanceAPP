# Production stack for attendance.cookblog.net on a single VPS.
# Host nginx terminates HTTPS and proxies to 127.0.0.1:8095 (app) and 127.0.0.1:3005 (Grafana).
name: attendance

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: attendance
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance -d attendance"]
      interval: 5s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://attendance:${POSTGRES_PASSWORD}@postgres:5432/attendance
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set in .env}
      ADMIN_FULL_NAME: Administrator
      ALLOW_SELF_REGISTRATION: "true"
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: '["https://attendance.cookblog.net"]'
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 256m
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prebuilt
    volumes:
      - ./frontend-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:8095:80"]
    depends_on: [backend]
    mem_limit: 64m
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.4.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    mem_limit: 192m
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:12.0.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_SERVER_ROOT_URL: https://attendance.cookblog.net/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      PROMETHEUS_URL: http://prometheus:9090
      PG_HOST: postgres:5432
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports: ["127.0.0.1:3005:3000"]
    depends_on: [prometheus, postgres]
    mem_limit: 256m
    restart: unless-stopped

  # Cloudflare Tunnel: publishes the frontend at attendance.cookblog.net without opening ports
  # or touching the host's nginx. --url routes every request to the frontend; the DNS record
  # (CNAME attendance -> <tunnel-id>.cfargotunnel.com) lives in Cloudflare.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --url http://frontend:80
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set in .env}
    depends_on: [frontend]
    mem_limit: 64m
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  prometheus:
  grafana:
