apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: ${PROMETHEUS_URL}
    isDefault: true

  - name: Attendance DB
    uid: attendance-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: ${PG_HOST}
    user: grafana_reader
    jsonData:
      database: attendance
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
    secureJsonData:
      password: grafana_reader
